securityDefinitions:
  BearerAuth:
    description: 'JWT access token. Example: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
  CookieAuth:
    description: JWT stored in the auth cookie after login
    in: cookie
    name: auth_token
    type: apiKey
swagger: "2.0"
