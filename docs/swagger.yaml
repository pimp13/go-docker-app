basePath: /
definitions:
  internal_admin_rbac.CreateRoleRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      permission_codes:
        items:
          type: string
        type: array
      slug:
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    - permission_codes
    - slug
    type: object
  internal_admin_rbac.SetRolePermissionsRequest:
    properties:
      permission_codes:
        items:
          type: string
        type: array
    required:
    - permission_codes
    type: object
  internal_admin_rbac.UpdateRoleRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  test_internal_dto.ChangePasswordRequest:
    properties:
      current_password:
        maxLength: 72
        type: string
      new_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  test_internal_dto.CreateArticleRequest:
    properties:
      author_id:
        type: string
      content:
        maxLength: 255
        minLength: 3
        type: string
      cover_image:
        maxLength: 255
        minLength: 3
        type: string
      excerpt:
        maxLength: 255
        minLength: 3
        type: string
      meta:
        additionalProperties: {}
        type: object
      published_at:
        type: string
      slug:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/test_internal_model.ArticleStatus'
        maxLength: 255
        minLength: 3
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - author_id
    - content
    - cover_image
    - excerpt
    - status
    - title
    type: object
  test_internal_dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        type: string
    required:
    - email
    - password
    type: object
  test_internal_dto.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      last_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  test_internal_dto.UserCreateRequest:
    properties:
      email:
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      last_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  test_internal_model.ArticleStatus:
    enum:
    - draft
    - published
    - archived
    type: string
    x-enum-varnames:
    - ArticleStatusDraft
    - ArticleStatusPublished
    - ArticleStatusArchived
  test_internal_service.HealthStatus:
    properties:
      status:
        type: string
      version:
        type: string
    type: object
  test_pkg_response.APIResponse:
    properties:
      result:
        $ref: '#/definitions/test_pkg_response.Result'
    type: object
  test_pkg_response.ErrorDetails:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  test_pkg_response.RequestDetails:
    properties:
      ip:
        type: string
      user_agent:
        type: string
    type: object
  test_pkg_response.Result:
    properties:
      data: {}
      error:
        $ref: '#/definitions/test_pkg_response.ErrorDetails'
      request:
        $ref: '#/definitions/test_pkg_response.RequestDetails'
      success:
        type: boolean
    type: object
host: localhost:8080
